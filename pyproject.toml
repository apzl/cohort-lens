[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohortlens-dev"
version = "0.1.0"
description = "Development tooling and Phase 1 validation for CohortLens"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr[simulation]==1.37.0",
    "numpy==2.4.6",
    "openai==2.54.0",
    "openpyxl==3.1.5",
    "pandas>=2.2.0,<3.0.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.0,<9.0.0",
    "statsmodels==0.14.5",
]

[project.scripts]
cohortlens = "cohortlens_operator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["operator/cohortlens_operator", "shared/cohortlens_shared"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["operator", "shared", "apps/cohort-analytics", "apps/cohort-agent"]
testpaths = ["tests"]
