[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohortlens-dev"
version = "0.1.0"
description = "Federated analytics on Flower: hash-bound contracts, site-local OLS-HC3, meta-analysis, and a schema-bounded LLM follow-up loop"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "apzl" }]
keywords = ["federated-analytics", "flower", "meta-analysis", "pharmacogenomics", "pydantic"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr[simulation]==1.37.0",
    "numpy==2.4.6",
    "openai==2.54.0",
    "openpyxl==3.1.5",
    "pandas>=2.2.0,<3.0.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.0,<9.0.0",
    "statsmodels==0.14.5",
]

[project.urls]
Repository = "https://github.com/apzl/cohort-lens"

[project.scripts]
cohortlens = "cohortlens_operator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["operator/cohortlens_operator", "shared/cohortlens_shared"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["operator", "shared", "apps/cohort-analytics", "apps/cohort-agent"]
testpaths = ["tests"]
