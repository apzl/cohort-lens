[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohortlens-analytics"
version = "0.1.0"
description = "The CohortLens federated analytics Flower App"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr[simulation]>=1.37.0,<1.38.0",
    "numpy>=2.4.0,<2.6.0",
    "pydantic==2.13.5",
]

[tool.hatch.build.targets.wheel]
packages = ["cohortlens_analytics", "cohortlens_shared"]

[tool.flwr.app]
publisher = "apsal"
fab-format-version = 1
flwr-version-target = "1.37.0"
fab-include = ["cohortlens_analytics/**/*.py", "cohortlens_shared/**/*.py", "LICENSE"]

[tool.flwr.app.config]
contract-json = "REQUIRED_OPERATOR_CONTRACT_JSON"
approval-json = "REQUIRED_OPERATOR_APPROVAL_JSON"
query-id = "primary-001"
node-wait-seconds = 30.0
reply-timeout-seconds = 30.0
followup-proposal-json = "REQUIRED_OPERATOR_FOLLOWUP_PROPOSAL_JSON"

[tool.flwr.app.components]
serverapp = "cohortlens_analytics.server_app:app"
clientapp = "cohortlens_analytics.client_app:app"
